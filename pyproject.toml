[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newtons-cathedral"
version = "0.3.0"
description = "G₁₃ Cathedral: Pure mathematical framework for structured emergence via URT contraction and Lytollis’s Law on centered icosahedral geometry (D=3)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cathedral collaborators" }]
keywords = ["geometry", "graph-theory", "spectral-geometry", "dynamical-systems", "structured-emergence", "icosahedral", "G13"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",  # kept for discoverability only
]

[project.urls]
Homepage = "https://github.com/con123-gif/URT-Enhanced-v2.0"
Documentation = "https://github.com/con123-gif/URT-Enhanced-v2.0/blob/grok-review/README.md"
Repository = "https://github.com/con123-gif/URT-Enhanced-v2.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
