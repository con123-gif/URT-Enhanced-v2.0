[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newtons-cathedral"
version = "0.3.1"
description = "Newton’s Cathedral: a mathematical oddity being developed towards a theory of nature."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Newton’s Cathedral research project" }]
keywords = [
    "physics",
    "complex-systems",
    "bounded-chaos",
    "icosahedral",
    "information-geometry",
    "kubo-mori",
    "gauge-theory",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["newtons_cathedral*", "cathedral_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"
