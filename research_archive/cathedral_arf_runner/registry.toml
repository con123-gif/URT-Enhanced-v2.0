[[gate]]
id = "A"
title = "Primitive selection"
status = "open"
question = "Derive the source and physical action from the π–φ–e URT recurrence F(x)=2x+φ⁻² mod 1, retaining all five solids, the 64 histories and the 24-clock."
evidence = ["geometry.hidden_isometry_24clock_Q6", "history.source_schur_ward_contacts", "integrity.handover_claims"]
missing = "The A5 chronology coefficient and the source weights (4,2,2,0) are not derived from the recurrence; the 24-clock is not derived from the six-bit mixing."

[[gate]]
id = "B"
title = "Charged operator"
status = "open"
question = "Establish the physical H13⊕H51 operator and its relation to the archived v61 Wilson operator and the 64-history transfer."
evidence = ["native.wilson_source", "native.output_gate", "conditional.ward_13_51_random_blocks"]
missing = "The 192×192 Wilson operator and the Q96 registry are not mapped to H64/H13⊕H51; the 13+51 Ward test uses random blocks, not that operator."

[[gate]]
id = "C"
title = "Gauge selection"
status = "open"
question = "Derive the electromagnetic generator, gauge-field normalisation and physical photon projector from the full source."
evidence = ["native.output_gate"]
missing = "native.output_gate reports physical_photon_residue = unselected."

[[gate]]
id = "D"
title = "Ward completion"
status = "open"
question = "First- and second-order gauge identities on the joined physical operator, including seagulls, source rotation, Schur relaxation and hidden-sector contacts."
evidence = ["history.source_schur_ward_contacts", "native.wilson_source", "conditional.charged_ward_2x2"]
missing = "Ward identities hold separately on the history sector and on the Wilson sea; not on a joined physical operator."

[[gate]]
id = "E"
title = "Physical observables"
status = "open"
question = "Define physical pole residues, couplings and renormalisation prescriptions without fitted values."
evidence = ["conditional.observable_nonuniqueness"]
missing = "Six distinct admissible observables of the same source spectrum exist; the history spectrum alone selects none."

[[gate]]
id = "F"
title = "Four ARFs"
status = "open"
question = "Recover the four historical ARFs from the observables of E, with uniqueness arguments and falsification tests."
evidence = []
missing = "Requires A–E."

