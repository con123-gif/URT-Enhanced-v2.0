# ------------------------------------------------------------------ compute queue
# Long exact computations for GitHub to run around the clock (.github/workflows/cathedral-compute.yml):
# one at a time, back to back, up to 330 minutes each; results land on the state branch under
# compute/<id>/ (status.json, log tail, outputs up to 5 MB per file; larger files stay in the
# run artifact for 90 days). A job runs once; to re-run it, give it a new id.
# Queue a job when a task needs more than ~10 minutes of computation. Each job must answer a
# stated question with an exact or finite computation: no scans against measured values.
#
# [[job]]
# id = "gateA-axis-order-classes"                 # [A-Za-z0-9._-]
# question = "Which A5 classes of signed six-axis assignments give distinct chronology second moments?"
# run = "python research_archive/2026-11-11_axis_order/classify.py --out {out}"   # {out} = outputs dir
# timeout_minutes = 120                           # 1..330
# requested_by = "Claude"                         # Claude | GPT | Grok | Con
# claim = "conditional"

# Two trivial self-test jobs prove on GitHub that the queue runs, records and chains back to back.
[[job]]
id = "selftest-compute-queue-1"
question = "Self-test 1/2: does the compute queue run a job and record it on the state branch?"
run = "python research_archive/cathedral_arf_runner/handover_claims.py --json {out}/handover_claims.json"
timeout_minutes = 5
requested_by = "Claude"
claim = "independent"

[[job]]
id = "selftest-compute-queue-2"
question = "Self-test 2/2: did the first job's run dispatch this one by itself?"
run = "python research_archive/2026-11-10_urt_arf_forward/automation/arf_colab_runner.py --once --output {out}/arf_results.jsonl"
timeout_minutes = 5
requested_by = "Claude"
claim = "regression"

[[job]]
id = "induced-photon-vacuum-census"
question = "Does any of 60 random-start minimisations of -log|det H(theta)| on the v61 lattice reach below Gamma(theta*) = -148.758644894?"
run = "python -u research_archive/2026-11-10_induced_photon/INDUCED_PHOTON_VACUUM_SELECTION_2026_11_10.py 60"
timeout_minutes = 150
requested_by = "Claude"
claim = "native"

# ------------------------------------------------------------------ research queue
# The open mathematical gates (handover 2026-11-10, section 13), in dependency order.
# status is "open" or "closed". A gate may be set to "closed" only together with
# proof_check = "<check id>" naming a check with claim = "derivation" that passes
# in the same run; otherwise the run fails (claim guard). Nothing else closes a gate.

[[gate]]
id = "A"
title = "Primitive selection"
status = "open"
question = "Derive the source and physical action from the π–φ–e URT recurrence F(x)=2x+φ⁻² mod 1, retaining all five solids, the 64 histories and the 24-clock."
evidence = ["geometry.hidden_isometry_24clock_Q6", "history.source_schur_ward_contacts", "integrity.handover_claims"]
missing = "The A5 chronology coefficient and the source weights (4,2,2,0) are not derived from the recurrence; the 24-clock is not derived from the six-bit mixing."

[[gate]]
id = "B"
title = "Charged operator"
status = "open"
question = "Establish the physical H13⊕H51 operator and its relation to the archived v61 Wilson operator and the 64-history transfer."
evidence = ["native.wilson_source", "native.output_gate", "conditional.ward_13_51_random_blocks"]
missing = "The 192×192 Wilson operator and the Q96 registry are not mapped to H64/H13⊕H51; the 13+51 Ward test uses random blocks, not that operator."

[[gate]]
id = "C"
title = "Gauge selection"
status = "open"
question = "Derive the electromagnetic generator, gauge-field normalisation and physical photon projector from the full source."
evidence = ["native.output_gate"]
missing = "native.output_gate reports physical_photon_residue = unselected."

[[gate]]
id = "D"
title = "Ward completion"
status = "open"
question = "First- and second-order gauge identities on the joined physical operator, including seagulls, source rotation, Schur relaxation and hidden-sector contacts."
evidence = ["history.source_schur_ward_contacts", "native.wilson_source", "conditional.charged_ward_2x2"]
missing = "Ward identities hold separately on the history sector and on the Wilson sea; not on a joined physical operator."

[[gate]]
id = "E"
title = "Physical observables"
status = "open"
question = "Define physical pole residues, couplings and renormalisation prescriptions without fitted values."
evidence = ["conditional.observable_nonuniqueness"]
missing = "Six distinct admissible observables of the same source spectrum exist; the history spectrum alone selects none."

[[gate]]
id = "F"
title = "Four ARFs"
status = "open"
question = "Recover the four historical ARFs from the observables of E, with uniqueness arguments and falsification tests."
evidence = []
missing = "Requires A–E."
