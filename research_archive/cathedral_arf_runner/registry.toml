# ------------------------------------------------------------------ compute queue
# Long exact computations for GitHub to run around the clock (.github/workflows/cathedral-compute.yml):
# one at a time, back to back, up to 330 minutes each; results land on the state branch under
# compute/<id>/ (status.json, log tail, outputs up to 5 MB per file; larger files stay in the
# run artifact for 90 days). A job runs once; to re-run it, give it a new id.
# Queue a job when a task needs more than ~10 minutes of computation. Each job must answer a
# stated question with an exact or finite computation: no scans against measured values.
#
# [[job]]
# id = "gateA-axis-order-classes"                 # [A-Za-z0-9._-]
# question = "Which A5 classes of signed six-axis assignments give distinct chronology second moments?"
# run = "python research_archive/2026-11-11_axis_order/classify.py --out {out}"   # {out} = outputs dir
# timeout_minutes = 120                           # 1..330
# requested_by = "Claude"                         # Claude | GPT | Grok | Con
# claim = "conditional"

# Two trivial self-test jobs prove on GitHub that the queue runs, records and chains back to back.
[[job]]
id = "selftest-compute-queue-1"
question = "Self-test 1/2: does the compute queue run a job and record it on the state branch?"
run = "python research_archive/cathedral_arf_runner/handover_claims.py --json {out}/handover_claims.json"
timeout_minutes = 5
requested_by = "Claude"
claim = "independent"

[[job]]
id = "selftest-compute-queue-2"
question = "Self-test 2/2: did the first job's run dispatch this one by itself?"
run = "python research_archive/2026-11-10_urt_arf_forward/automation/arf_colab_runner.py --once --output {out}/arf_results.jsonl"
timeout_minutes = 5
requested_by = "Claude"
claim = "regression"

[[job]]
id = "induced-photon-vacuum-census"
question = "Does any of 60 random-start minimisations of -log|det H(theta)| on the v61 lattice reach below Gamma(theta*) = -148.758644894?"
run = "python -u research_archive/2026-11-10_induced_photon/INDUCED_PHOTON_VACUUM_SELECTION_2026_11_10.py 60"
timeout_minutes = 150
requested_by = "Claude"
claim = "native"

[[job]]
id = "registry-induced-vacuum-census"
question = "Q16 census: from 30 random starts (plus theta*), with saddle escape, is any strict local minimum of Gamma_Q = 36G(t)+36G(2t)+12G(3t) below -10679.896670 (the minimum reached from theta*)?"
run = "python -u research_archive/2026-11-11_registry_induced_vacuum/REGISTRY_INDUCED_VACUUM_2026_11_11.py 30"
timeout_minutes = 300
requested_by = "Claude"
claim = "conditional"

[[job]]
id = "q17-flat-link-genericity"
question = "Q17: over the 120-point (r, M, c_t) grid, does every nonsingular point have unstable flat links for -log|det H|, with 72 the plateau count?"
run = "python -u research_archive/2026-11-11_q17_flat_link_genericity/Q17_FLAT_LINK_GENERICITY_2026_11_11.py"
timeout_minutes = 90
requested_by = "Claude"
claim = "independent"

