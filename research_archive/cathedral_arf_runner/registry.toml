# Cathedral orchestrator registry — the only file to edit to change what runs.
#
# Every [[check]] runs in its stage's CI job, in the order listed. Commands are
# split shell-style (no shell); a leading "python" means the job's interpreter;
# "{out}" is the stage's results directory; cwd is relative to the repo root.
#
# claim (set HERE, never inferred from a script's output):
#   regression   reproduces an archived computation: "the code still computes what it computed"
#   independent  recomputes a stated result from scratch, importing nothing from the archive
#   native       executes the archived native source operators (v61 Wilson, Q96 registry, H64 history)
#   conditional  exact algebra on a declared conditional input (e.g. the A5 quartet spectrum)
#   synthetic    generic algebra on synthetic/random matrices; says nothing about the Cathedral operator
#
# gating = true: a failure turns the run red (and GitHub emails you).
# gating = false: reported in the summary only.
#
# A passing check NEVER closes a physical gate. See [[gate]] at the bottom.

[run]
python = "3.11"
state_branch = "cathedral-research-state"

[sweep]
# Resumable execution sweep over every archived research script.
# Priority each run: never executed > source changed since last run > oldest result.
include = ["research_archive/**/*.py"]
exclude = [
  "research_archive/cathedral_arf_runner/**",          # the orchestrator itself
  "research_archive/2026-10-28_cathedral_james_yangmills/**",  # third-party material: not executed here
]
per_script_timeout = 120     # seconds
budget_minutes = 20          # per run; the cursor resumes next run

[sweep.args]
# Command-line arguments for scripts that need them ({out} = sweep results dir).
"research_archive/2026-11-10_urt_arf_forward/automation/arf_colab_runner.py" = ["--once", "--output", "{out}/arf_colab_sweep.jsonl"]

# ------------------------------------------------------------------ integrity
[[check]]
id = "integrity.h64_snapshot_sha256"
stage = "integrity"
claim = "regression"
gating = true
run = "python research_archive/2026-10-17_recovery_assets/restore_matrices.py --verify"
timeout = 120

[[check]]
id = "integrity.arf_forward_manifest"
stage = "integrity"
claim = "regression"
gating = true
run = "sha256sum --quiet --strict -c MANIFEST.sha256"
cwd = "research_archive/2026-11-10_urt_arf_forward"
timeout = 60

[[check]]
id = "integrity.handover_claims"
stage = "integrity"
claim = "independent"
gating = true
run = "python research_archive/cathedral_arf_runner/handover_claims.py --json {out}/handover_claims.json"
outputs = ["{out}/handover_claims.json"]
timeout = 120

