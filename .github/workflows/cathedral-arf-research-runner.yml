name: Cathedral ARF research verification runner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [newtons-cathedral]
    paths:
      - '.github/workflows/cathedral-arf-research-runner.yml'
      - 'research_archive/2026-11-10_urt_arf_forward/new_gate/URT_NATIVE_SOURCE_24CLOCK_FOURIER_VERIFY_2026_11_10.py'
      - 'research_archive/2026-11-10_urt_arf_forward/new_gate/URT_A5_CHRONOLOGY_DIRICHLET_GAP_2026_11_10.py'
      - 'research_archive/2026-11-10_urt_arf_forward/new_gate/URT_A5_SYMMETRIC_CUBIC_SOURCE_2026_11_10.py'
      - 'research_archive/2026-11-10_urt_arf_forward/new_gate/URT_EXACT_A4_THIRD_CUMULANT_RATE_2026_11_10.py'
      - 'research_archive/2026-11-10_urt_arf_forward/new_gate/URT_SOURCE_SCHUR_WARD_CONTACTS_2026_11_10.py'

permissions:
  contents: read

concurrency:
  group: cathedral-arf-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newtons-cathedral
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mathematical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy mpmath
      - name: Run original-source, chronology and Ward verification with individual logs
        shell: bash
        run: |
          mkdir -p cathedral-arf-run
          set +e
          failed=0
          for script in \
            URT_EXACT_A4_THIRD_CUMULANT_RATE_2026_11_10.py \
            URT_A5_SYMMETRIC_CUBIC_SOURCE_2026_11_10.py \
            URT_A5_CHRONOLOGY_DIRICHLET_GAP_2026_11_10.py \
            URT_SOURCE_SCHUR_WARD_CONTACTS_2026_11_10.py \
            URT_NATIVE_SOURCE_24CLOCK_FOURIER_VERIFY_2026_11_10.py
          do
            path="research_archive/2026-11-10_urt_arf_forward/new_gate/$script"
            echo "::group::$script"
            if [ ! -f "$path" ]; then
              echo "MISSING $path" | tee "cathedral-arf-run/$script.log"
              failed=1
            else
              python -u "$path" >"cathedral-arf-run/$script.log" 2>&1
              rc=$?
              cat "cathedral-arf-run/$script.log"
              if [ "$rc" -ne 0 ]; then
                echo "FAILED ($rc): $script"
                failed=1
              else
                echo "PASS: $script"
              fi
            fi
            echo "::endgroup::"
          done
          echo "commit=$GITHUB_SHA" > cathedral-arf-run/manifest.txt
          echo "utc=$(date -u +%FT%TZ)" >> cathedral-arf-run/manifest.txt
          echo "failed=$failed" >> cathedral-arf-run/manifest.txt
          exit "$failed"
      - name: Retain test logs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-arf-checks-${{ github.run_id }}
          path: cathedral-arf-run/
          retention-days: 30
          if-no-files-found: warn
