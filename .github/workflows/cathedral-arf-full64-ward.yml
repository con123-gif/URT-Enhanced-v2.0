name: Cathedral full 64-carrier Ward stress
on:
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
jobs:
  ward64:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newtons-cathedral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Verify full 13+51 Schur current and second Ward contact
        run: |
          mkdir -p research-results
          OPENBLAS_NUM_THREADS=1 python research_archive/cathedral_arf_runner/full_64_ward_stress.py | tee research-results/full_64_ward_stress.json
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-64-ward-${{ github.run_id }}
          path: research-results/
          retention-days: 90
