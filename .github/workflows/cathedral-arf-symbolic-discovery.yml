name: Cathedral ARF symbolic discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: read
jobs:
  exact-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newtons-cathedral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Generate and falsify exact source-moment recurrence
        run: |
          mkdir -p research-results
          python research_archive/cathedral_arf_runner/symbolic_discovery.py --degree 32 | tee research-results/symbolic_discovery.json
      - name: Archive exact discoveries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-symbolic-discovery-${{ github.run_id }}
          path: research-results/
          retention-days: 90
