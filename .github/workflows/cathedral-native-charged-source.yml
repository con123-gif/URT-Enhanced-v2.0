name: Cathedral native charged source to Ward gate
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
jobs:
  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newtons-cathedral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy sympy
      - name: Execute archived physical charged source with all contact terms
        run: |
          mkdir -p research-results
          python -u research_archive/2026-10-17_original_oct08_source/common_action_work/matter/microscopic_source_currents.py > research-results/native_source.log 2>&1 || { tail -100 research-results/native_source.log; exit 1; }
      - name: Reject incomplete or synthetic source substitution
        run: |
          python research_archive/cathedral_arf_runner/native_charged_source_gate.py | tee research-results/native_source_gate.json
      - name: Archive real source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-native-charged-${{ github.run_id }}
          path: |
            research-results/
            research_archive/2026-10-17_original_oct08_source/common_action_work/matter/microscopic_source_currents_checks.json
          retention-days: 90
