name: Cathedral ARF observable map search
on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
permissions:
  contents: read
jobs:
  map-search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newtons-cathedral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Search candidate source-to-observable maps and test identifiability
        run: |
          mkdir -p research-results
          python research_archive/cathedral_arf_runner/observable_map_search.py | tee research-results/observable_map_search.json
      - name: Retain candidate and obstruction certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-observable-search-${{ github.run_id }}
          path: research-results/
          retention-days: 90
