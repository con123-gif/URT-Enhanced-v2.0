name: Cathedral charged matter Ward search
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
jobs:
  charged-ward:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newtons-cathedral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Check exact charged matter current, seagull and Schur Ward identities
        run: |
          mkdir -p research-results
          python research_archive/cathedral_arf_runner/charged_matter_ward_search.py | tee research-results/charged_matter_ward.json
      - name: Archive verified algebra and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-charged-ward-${{ github.run_id }}
          path: research-results/
          retention-days: 90
