name: Cathedral ARF three-minute verification
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [newtons-cathedral]
    paths:
      - '.github/workflows/cathedral-arf-3min.yml'
concurrency:
  group: cathedral-arf-verification
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newtons-cathedral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - name: Five no-fit verification runs approximately 3 minutes apart
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            python research_archive/2026-11-10_urt_arf_forward/automation/arf_colab_runner.py --once --output arf_results.jsonl
            if [ "$i" -lt 5 ]; then sleep 180; fi
          done
      - name: Save timestamped mathematical verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arf-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: arf_results.jsonl
          if-no-files-found: warn
          retention-days: 14
