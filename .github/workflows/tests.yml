name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov hypothesis

      - name: Run full test suite
        run: pytest tests/ -q --tb=short

      - name: Run drift / consistency / property guards explicitly
        run: |
          pytest tests/test_constant_drift.py -q
          pytest tests/test_cross_module_consistency.py -q
          pytest tests/test_deep_patterns.py -q
          pytest tests/test_property_invariants.py -q
          pytest tests/test_baryon_three_formulas.py -q
          pytest tests/test_falsifiable_predictions.py -q

      - name: Coverage report (no fail; informational)
        run: |
          pytest tests/ --cov=urt --cov-report=term --cov-report=xml -q || true

      - name: Upload coverage XML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
